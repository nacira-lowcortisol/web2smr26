<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HORARIO</title>
	<link rel="stylesheet" type="text/css" href="./css/estilos.css">
</head>
<body> 
	<table border="2">
		<caption style="color: blue; background-color: teal;"><b>HORARIO</b></caption>
		<tr>
			<th>Hora</th>
			<th>L</th>
			<th>M</th>
			<th>X</th>
			<th>J</th>
			<th>V</th>
		</tr>
		<tr>
			<td>8:30-9:30</td>
			<td rowspan="2" class="sistemas">SIOPR</td>
			<td rowspan="2" class="appw">APLWE</td>
			<td rowspan="2" class="servicios">SERRE</td>
			<td class="sistemas">SIOPR</td>
			<td class="ingles">IP GM</td>
		</tr>
		<tr>
			<td>9:30-10:30</td>
			<td class="seguridad">SEGIN</td>
			<td class="ipe">IPE II</td>
		</tr>
		<tr>
			<td>10:30-11:30</td>
			<td class="servicios">SERRE</td>
			<td class="seguridad">SEGIN</td>
			<td class="proyecto">PI</td>
			<td class="appw">APLWE</td>
			<td class="servicios">SERRE</td>
		</tr>
		<tr>
			<td>11:30-12:00</td>
			<td colspan="5">RECREO</td>
		</tr>
		<tr>
			<td>12:00-13:00</td>
			<td class="servicios">SERRE</td>
			<td class="ipe">IPE II</td>
			<td class="proyecto">PI</td>
			<td class="appw">APLWE</td>
			<td class="servicios">SERRE</td>
		</tr>
		<tr>
			<td>13:00-14:00</td>
			<td class="seguridad">SEGIN</td>
			<td rowspan="2" class="sistemas">SIOPR</td>
			<td class="ipe">IPE II</td>
			<td rowspan="2" class="prog">PW</td>
			<td class="sistemas">SIOPR</td>
		</tr>
		<tr>
			<td>14:00-15:00</td>
			<td class="ingles">IP GM</td>
			<td class="prog">PW</td>
			<td class="seguridad">SEGIN</td>
		</tr>
	</table>
</body>
</html>
