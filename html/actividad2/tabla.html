<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<!--Tabla de 4x3-->
	<table border="2">
		<caption>Aprendiendo sobre tablas</caption>
		<tr>
			<th><b>Cabecera1</b></th>
			<th><b>Cabecera2</b></th>
			<th><b>Cabecera3</b></th>
		</tr>
		<tr>
			<td>a</td>
			<td>b</td>
			<td>c</td>
		</tr>
		<tr>
			<td>1</td>
			<td>2</td>
			<td>3</td>
		</tr>
		<tr>
			<td>A</td>
			<td>B</td>
			<td>C</td>
		</tr>
	</table>
	<!--Tabla de 4x3-->
	<table border="2">
		<caption>Aprendiendo sobre tablas</caption>
		<tr>
			<th colspan="2"><b>Cabecera1-2</b></th>
			<th><b>Cabecera3</b></th>
		</tr>
		<tr>
			<td rowspan="2">a</td>
			<td>b</td>
			<td>c</td>
		</tr>
		<tr>
			<td>2</td>
			<td>3</td>
		</tr>
		<tr>
			<td>A</td>
			<td>B</td>
			<td>C</td>
		</tr>
	</table>
</body>
</html>
